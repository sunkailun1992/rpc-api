plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'com'
version = '1.0.8'
description = 'rpc-api'

def privateMavenUrl = providers.gradleProperty('privateMavenUrl')
        .orElse(providers.environmentVariable('PRIVATE_MAVEN_URL'))
def privateMavenUsername = providers.gradleProperty('privateMavenUsername')
        .orElse(providers.environmentVariable('PRIVATE_MAVEN_USERNAME'))
def privateMavenPassword = providers.gradleProperty('privateMavenPassword')
        .orElse(providers.environmentVariable('PRIVATE_MAVEN_PASSWORD'))

ext {
    javaReleaseVersion = 17
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(javaReleaseVersion)
    }
    withSourcesJar()
    withJavadocJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = javaReleaseVersion
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
    options.charSet = 'UTF-8'
    options.docEncoding = 'UTF-8'
    options.addStringOption('Xdoclint:none', '-quiet')
    failOnError = false
}

tasks.withType(GenerateModuleMetadata).configureEach {
    enabled = false
}

tasks.named('test') {
    useJUnitPlatform()
}

repositories {
    mavenLocal()
    mavenCentral()
    maven { url 'https://maven.aliyun.com/repository/public' }
    if (privateMavenUrl.isPresent()) {
        maven {
            name = 'privateRelease'
            url = uri(privateMavenUrl.get())
            if (privateMavenUsername.isPresent() && privateMavenPassword.isPresent()) {
                credentials {
                    username = privateMavenUsername.get()
                    password = privateMavenPassword.get()
                }
            }
        }
    }
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:6.0.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = 'rpc-api'
        }
    }
    repositories {
        mavenLocal()
        if (privateMavenUrl.isPresent()) {
            maven {
                name = 'privateRelease'
                url = uri(privateMavenUrl.get())
                if (privateMavenUsername.isPresent() && privateMavenPassword.isPresent()) {
                    credentials {
                        username = privateMavenUsername.get()
                        password = privateMavenPassword.get()
                    }
                }
            }
        }
    }
}
